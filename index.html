<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
        }

        .hero h2 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .btn {
            background: white;
            color: #2563eb;
            padding: 13px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .cards {
            padding: 50px;
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 280px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        footer {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h2>Welcome 👋</h2>
            <p>This is a random HTML website.</p>
            <button class="btn" onclick="showMessage()">
                Click Me
            </button>
        </div>
    </section>

    <section class="cards">

        <div class="card">
            <h3>🚀 Fast</h3>
            <p>Simple and lightweight website design.</p>
        </div>

        <div class="card">
            <h3>🎨 Modern</h3>
            <p>Clean and modern user interface.</p>
        </div>

        <div class="card">
            <h3>💻 Responsive</h3>
            <p>Works nicely on different screen sizes.</p>
        </div>

    </section>

    <footer>
        <p>© 2026 My Random Website</p>
    </footer>

    <script>
        function showMessage() {
            alert("Hello! Button clicked successfully 😎");
        }
    </script>

</body>
</html>
